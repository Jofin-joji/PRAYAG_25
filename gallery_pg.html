<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayag 25 | Gallery</title>
  <link rel="icon" type="image/png" href="images/dune1.png">
  <link rel="stylesheet" href="static/style/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
  <style>
    :root {
      --spice-gold: #D4AF37;
      --desert-sand: #F4E4BC;
      --deep-black: #0A0A0A;
      --spice-orange: #FF8C00;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at center, var(--deep-black) 60%, #000 100%);
      font-family: 'Orbitron', monospace;
      color: var(--desert-sand);
      overflow: hidden;
    }
    /* Animated starfield background */
    .stars, .stars2, .stars3 {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 120%;
        transform: rotate(0deg);
        z-index: 0;
    }

    .stars {
        background-image: 
            radial-gradient(4px 4px at 20px 30px, #D4AF37, transparent),
            radial-gradient(3px 3px at 40px 70px, #D4AF37, transparent),
            radial-gradient(1px 1px at 90px 40px, #D4AF37, transparent),
            radial-gradient(1px 1px at 130px 80px, #D4AF37, transparent),
            radial-gradient(2px 2px at 160px 30px, #D4AF37, transparent);
        background-repeat: repeat;
        background-size: 200px 100px;
        animation: stars 20s linear infinite;
    }

    .stars2 {
        background-image: 
            radial-gradient(3px 3px at 40px 60px, #D4AF37, transparent),
            radial-gradient(1px 1px at 120px 50px, #D4AF37, transparent),
            radial-gradient(1px 1px at 190px 90px, #D4AF37, transparent),
            radial-gradient(1px 1px at 60px 20px, #D4AF37, transparent);
        background-repeat: repeat;
        background-size: 250px 120px;
        animation: stars 30s linear infinite;
    }

    .stars3 {
        background-image: 
            radial-gradient(1px 1px at 10px 10px, #D4AF37, transparent),
            radial-gradient(1px 1px at 150px 150px, #D4AF37, transparent),
            radial-gradient(1px 1px at 60px 150px, #D4AF37, transparent),
            radial-gradient(1px 1px at 175px 50px, #D4AF37, transparent),
            radial-gradient(2px 2px at 100px 75px, #D4AF37, transparent);
        background-repeat: repeat;
        background-size: 300px 200px;
        animation: stars 40s linear infinite;
    }

    @keyframes stars {
        from { transform: translateY(0px); }
        to { transform: translateY(-2000px); }
    }
    h1 {
      text-align: center;
      padding: 20px;
      font-size: 3rem;
      color: var(--spice-gold);
      letter-spacing: 3px;

      background: linear-gradient(135deg, var(--spice-gold), var(--spice-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleGlow 2s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(255, 195, 0, 0.6);
    }
    .swiper {
      width: 90%;
      height: 80vh;
    }
    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 320px;
      height: 450px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(212,175,55,0.3);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      border: 2px solid var(--spice-gold);
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .swiper-slide-active {
      transform: scale(1.08);
      box-shadow: 0 20px 60px rgba(255,140,0,0.6);
    }
    .swiper-pagination-bullet {
      background: var(--spice-gold);
      opacity: 0.7;
    }
    .swiper-pagination-bullet-active {
      background: var(--spice-orange);
      opacity: 1;
      transform: scale(1.2);
    }

    /* ================= MOBILE OPTIMIZATION ================= */
    @media (max-width: 768px) {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* centers vertically */
        text-align: center;
        padding: 10px;
      }

      h1 {
        font-size: 1.2rem;  /* smaller title */
        margin-bottom: 15px;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--spice-gold), var(--spice-orange));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: titleGlow 2s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(255, 195, 0, 0.6);
      }

      .swiper {
        width: 100%;
        height: 90vh; 
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .swiper-slide {
        width: 60vw;     /* card size */
        height: 30vh;    /* smaller for mobile */
        border-radius: 16px;
        margin: 10px auto; /* spacing between slides */
        opacity: 0.6;    /* inactive slides look faded */
        transform: scale(0.9);
        transition: all 0.4s ease;
      }

      .swiper-slide-active {
        opacity: 1;
        transform: scale(1.05);  /* highlight active */
        box-shadow: 0 12px 30px rgba(255, 140, 0, 0.4); /* glow */
      }

      /* Move pagination to right side */
      .swiper-pagination {
        right: 8px;
        left: auto;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>

  <h1>PRAYAG 25 | Gallery</h1>

  <div class="swiper">
    <div class="swiper-wrapper" id="slider-wrapper">
      <!-- Slides will be injected here -->
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
  <script>
    const totalImages = 40;
    const folderPath = "images/";
    const fileExtension = ".jpg";
    const wrapper = document.getElementById("slider-wrapper");

    // Generate slides dynamically
    for (let i = 1; i <= totalImages; i++) {
      const slide = document.createElement("div");
      slide.classList.add("swiper-slide");
      slide.innerHTML = `<img src="${folderPath}${i}${fileExtension}" alt="Image ${i}">`;
      wrapper.appendChild(slide);
    }
    
    // Detect screen size
    const isSmallScreen = window.matchMedia("(max-width: 768px)").matches;

    // Swiper configuration
    const swiperConfig = {
      grabCursor: true,
      centeredSlides: true,
      loop: true,
      speed: 900,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      ...(isSmallScreen 
        ? { 
            // ✅ Mobile: vertical coverflow + momentum
            direction: "vertical",
            effect: "coverflow",
            centeredSlides: true,
            slidesPerView: "auto",
            coverflowEffect: {
              rotate: 15,
              stretch: 0,
              depth: 120,
              modifier: 1,
              slideShadows: true,
            },
            autoplay: {
              delay: 300,
              disableOnInteraction: false,
            },
            freeMode: {
              enabled: true,       // enables free scroll
              momentum: true,      // smooth momentum effect
              momentumRatio: 0.4,  // inertia speed
              momentumBounce: true // bounce at edges
            },
            freeModeSticky: true   // snap to center after momentum
          } 
        : { 
            // ✅ Desktop: horizontal coverflow
            direction: "horizontal",
            effect: "coverflow",
            slidesPerView: "auto",
            coverflowEffect: {
              rotate: 40,
              stretch: 0,
              depth: 250,
              modifier: 1,
              slideShadows: true,
            },
            autoplay: {
              delay: 300,
              disableOnInteraction: false,
            }
          }
      )
    };

    // Initialize Swiper
    var swiper = new Swiper(".swiper", swiperConfig);
  </script>
  <script src="static/script/nav-script.js"></script> 
</body>
